<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Java Mods</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Press Start 2P';
background:#050505;
color:white;
}

header{
padding:20px;
text-align:center;
color:#55ff55;
text-shadow:0 0 10px #55ff55;
}

#modsContainer{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
padding:10px;
border-radius:10px;
}

img{width:100%;border-radius:10px;}

button{
padding:10px;
margin:5px;
cursor:pointer;
}

.download{background:green;color:white;}
.like{background:red;color:white;}
.favorite{background:purple;color:white;}

</style>

</head>

<body>

<header>JAVA MODS</header>

<section id="modsContainer"></section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

<script>

if(!localStorage.getItem("user")){
location.href="login.html";
}

const container = document.getElementById("modsContainer");

db.collection("mods")
.where("type","==","java")
.onSnapshot(snapshot=>{

container.innerHTML="";

snapshot.forEach(doc=>{

let m = doc.data();

container.innerHTML += `
<div class="card">

<img src="${m.image}">

<h3>${m.title}</h3>
<p>${m.description}</p>

<div>
<button class="download">Download</button>
<button class="like">Like ${m.likes||0}</button>
<button class="favorite">Fav ${m.favorites||0}</button>
</div>

</div>
`;

});

});

</script>

</body>
</html>
