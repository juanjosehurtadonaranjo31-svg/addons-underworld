<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Java Mods | Addons Underworld
</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
rel="stylesheet">

<style>

/* ========================= */
/* RESET */
/* ========================= */

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{

    background:#050505;

    color:white;

    font-family:'Press Start 2P', cursive;

    overflow-x:hidden;

}

/* ========================= */
/* BACKGROUND */
/* ========================= */

#background{

    position:fixed;

    width:100%;
    height:100%;

    z-index:-10;

    background:

    radial-gradient(
    circle at center,
    rgba(0,255,100,0.08),
    transparent 60%
    ),

    linear-gradient(
    180deg,
    #020202,
    #081208,
    #050505
    );

}

/* ========================= */
/* HEADER */
/* ========================= */

header{

    width:100%;

    padding:30px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-wrap:wrap;

    border-bottom:
    2px solid rgba(255,255,255,0.08);

    background:
    rgba(0,0,0,0.4);

    backdrop-filter:blur(10px);

    position:sticky;

    top:0;

    z-index:100;

}

#logo{

    color:#55ff55;

    font-size:24px;

    text-shadow:

    0 0 10px #55ff55,
    0 0 30px #00ff99;

}

/* ========================= */
/* SEARCH */
/* ========================= */

#search{

    padding:15px;

    width:320px;

    border:none;

    outline:none;

    border-radius:12px;

    background:#111;

    color:white;

    font-family:'Press Start 2P', cursive;

    font-size:10px;

}

/* ========================= */
/* MODS CONTAINER */
/* ========================= */

#modsContainer{

    padding:50px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));

    gap:40px;

}

/* ========================= */
/* MOD CARD */
/* ========================= */

.modCard{

    background:
    linear-gradient(
    180deg,
    rgba(20,20,20,0.95),
    rgba(5,5,5,0.98)
    );

    border:
    3px solid rgba(255,255,255,0.08);

    border-radius:20px;

    overflow:hidden;

    transition:0.3s;

    position:relative;

    box-shadow:
    0 0 20px rgba(0,255,100,0.08);

}

.modCard:hover{

    transform:translateY(-10px);

    box-shadow:
    0 0 40px rgba(0,255,100,0.2);

}

/* ========================= */
/* IMAGE */
/* ========================= */

.modImage{

    width:100%;

    height:220px;

    object-fit:cover;

}

/* ========================= */
/* INFO */
/* ========================= */

.modInfo{

    padding:25px;

}

.modTitle{

    color:#55ff55;

    font-size:16px;

    margin-bottom:20px;

}

.modDescription{

    font-size:10px;

    line-height:1.8;

    opacity:0.8;

    margin-bottom:25px;

}

/* ========================= */
/* VIDEO */
/* ========================= */

iframe{

    width:100%;

    height:200px;

    border:none;

    border-radius:10px;

    margin-bottom:20px;

}

/* ========================= */
/* BUTTONS */
/* ========================= */

.buttons{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}

.modButton{

    flex:1;

    padding:12px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    color:white;

    font-family:'Press Start 2P', cursive;

    font-size:8px;

    transition:0.2s;

}

.download{

    background:#00aa55;

}

.favorite{

    background:#8844ff;

}

.like{

    background:#ff3366;

}

.modButton:hover{

    transform:scale(1.05);

}

/* ========================= */
/* STARS */
/* ========================= */

.stars{

    margin-top:20px;

    color:gold;

    font-size:14px;

}

/* ========================= */
/* COUNTER */
/* ========================= */

.counter{

    margin-top:15px;

    font-size:8px;

    opacity:0.7;

    display:flex;

    justify-content:space-between;

    flex-wrap:wrap;

    gap:10px;

}

/* ========================= */
/* SECRET ADMIN */
/* ========================= */

#secretLCK{

    position:fixed;

    bottom:10px;

    right:10px;

    width:20px;

    height:20px;

    opacity:0;

    z-index:999;

}

/* ========================= */
/* RESPONSIVE */
/* ========================= */

@media(max-width:768px){

    header{

        flex-direction:column;

        gap:20px;

    }

    #search{

        width:100%;

    }

    #modsContainer{

        padding:20px;

    }

}

</style>

</head>

<body>

<div id="background"></div>

<header>

<div id="logo">

JAVA MODS

</div>

<input
type="text"
id="search"
placeholder="SEARCH MODS..."
>

</header>

<section id="modsContainer">

</section>

<button id="secretLCK"></button>

<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="firebase-config.js"></script>

<!-- ========================= -->
<!-- SCRIPT -->
<!-- ========================= -->

<script>

/* ========================= */
/* CONTAINER */
/* ========================= */

const modsContainer =
document.getElementById("modsContainer");

/* ========================= */
/* RENDER MODS */
/* ========================= */

db.collection("mods")

.where("type","==","java")

.orderBy("createdAt","desc")

.onSnapshot(snapshot=>{

    modsContainer.innerHTML = "";

    snapshot.forEach(doc=>{

        const mod =
        doc.data();

        modsContainer.innerHTML += `

        <div class="modCard">

            <img
            class="modImage"
            src="${mod.image}"
            >

            <div class="modInfo">

                <div class="modTitle">

                ${mod.title}

                </div>

                <div class="modDescription">

                ${mod.description}

                </div>

                <iframe
                src="${mod.video}">
                </iframe>

                <div class="stars">

                ★★★★★

                </div>

                <div class="counter">

                    <div>
                    ❤️ ${mod.likes || 0}
                    </div>

                    <div>
                    ⭐ ${mod.favorites || 0}
                    </div>

                    <div>
                    ⬇️ ${mod.downloads || 0}
                    </div>

                </div>

                <div class="buttons">

                    <button
                    class="modButton download"
                    onclick="downloadMod('${doc.id}')"
                    >

                    DOWNLOAD

                    </button>

                    <button
                    class="modButton favorite"
                    onclick="favoriteMod('${doc.id}')"
                    >

                    FAVORITE

                    </button>

                    <button
                    class="modButton like"
                    onclick="likeMod('${doc.id}')"
                    >

                    LIKE

                    </button>

                </div>

            </div>

        </div>

        `;

    });

});

/* ========================= */
/* LIKE */
/* ========================= */

async function likeMod(id){

    const ref =
    db.collection("mods").doc(id);

    const docSnap =
    await ref.get();

    const likes =
    (docSnap.data().likes || 0) + 1;

    await ref.update({

        likes:likes

    });

}

/* ========================= */
/* FAVORITE */
/* ========================= */

async function favoriteMod(id){

    const ref =
    db.collection("mods").doc(id);

    const docSnap =
    await ref.get();

    const favorites =
    (docSnap.data().favorites || 0) + 1;

    await ref.update({

        favorites:favorites

    });

}

/* ========================= */
/* DOWNLOAD */
/* ========================= */

async function downloadMod(id){

    const button =
    event.target;

    let time = 10;

    button.innerText =
    "WAIT "+time+"s";

    button.disabled = true;

    const interval =
    setInterval(async ()=>{

        time--;

        button.innerText =
        "WAIT "+time+"s";

        if(time<=0){

            clearInterval(interval);

            button.innerText =
            "DOWNLOAD";

            button.disabled = false;

            const ref =
            db.collection("mods").doc(id);

            const docSnap =
            await ref.get();

            const downloads =
            (docSnap.data().downloads || 0) + 1;

            await ref.update({

                downloads:downloads

            });

            alert("DOWNLOAD STARTED");

        }

    },1000);

}

/* ========================= */
/* SEARCH */
/* ========================= */

const search =
document.getElementById("search");

search.addEventListener("input",()=>{

    const value =
    search.value.toLowerCase();

    document.querySelectorAll(".modCard")

    .forEach(card=>{

        const text =
        card.innerText.toLowerCase();

        card.style.display =

        text.includes(value)

        ? "block"

        : "none";

    });

});

/* ========================= */
/* SECRET ADMIN */
/* ========================= */

document.getElementById("secretLCK")
.onclick = ()=>{

    const code =
    prompt("ENTER LCK");

    if(code==="LCK-UNDERWORLD"){

        alert("ADMIN ACCESS");

        window.location.href =
        "admin.html";

    }

};

/* ========================= */
/* FIREBASE STATUS */
/* ========================= */

console.log("Firebase Connected");

</script>

</body>
</html>
