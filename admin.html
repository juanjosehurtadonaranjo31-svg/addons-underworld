<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Admin Panel</title>

<style>
body{
font-family:sans-serif;
background:#111;
color:white;
padding:20px;
}

input,select{
display:block;
margin:10px 0;
padding:10px;
width:100%;
}
</style>

</head>

<body>

<h1>ADMIN PANEL</h1>

<input id="title" placeholder="Titulo">
<input id="desc" placeholder="Descripcion">
<input id="image" placeholder="Imagen URL">
<input id="video" placeholder="Video URL">

<select id="type">
<option value="java">Java</option>
<option value="bedrock">Bedrock</option>
</select>

<button onclick="upload()">Subir Mod</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

<script>

function upload(){

db.collection("mods").add({

title:title.value,
description:desc.value,
image:image.value,
video:video.value,
type:type.value,
likes:0,
favorites:0,
downloads:0,
createdAt:Date.now()

});

alert("MOD SUBIDO");

}

</script>

</body>
</html>
