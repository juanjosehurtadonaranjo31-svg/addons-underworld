<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Addons Underworld</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    background:
    linear-gradient(
    180deg,
    #020202,
    #120018,
    #020202
    );

    font-family:'Press Start 2P', cursive;

    color:white;
}

/* ========================= */
/* FONDO */
/* ========================= */

#background{

    position:fixed;

    width:100%;
    height:100%;

    z-index:-10;

    background:
    radial-gradient(circle at center,
    rgba(140,0,255,0.15),
    transparent 60%);
}

/* ========================= */
/* LOGIN BOX */
/* ========================= */

#loginBox{

    width:90%;
    max-width:500px;

    background:
    rgba(10,10,10,0.95);

    border:
    3px solid rgba(255,255,255,0.08);

    border-radius:25px;

    padding:40px;

    display:flex;

    flex-direction:column;

    gap:25px;

    box-shadow:
    0 0 40px rgba(140,0,255,0.2);
}

/* ========================= */
/* TITLE */
/* ========================= */

#title{

    text-align:center;

    font-size:22px;

    color:#c77dff;

    text-shadow:
    0 0 10px #9d4edd,
    0 0 30px #c77dff;
}

/* ========================= */
/* INPUTS */
/* ========================= */

input{

    width:100%;

    padding:18px;

    border:none;

    outline:none;

    border-radius:14px;

    background:#111;

    color:white;

    font-family:'Press Start 2P', cursive;

    font-size:10px;
}

/* ========================= */
/* BOTONES */
/* ========================= */

button{

    width:100%;

    padding:18px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    color:white;

    font-family:'Press Start 2P', cursive;

    font-size:10px;

    transition:0.3s;
}

#loginBtn{

    background:
    linear-gradient(
    135deg,
    #7b2cbf,
    #c77dff
    );
}

#googleBtn{

    background:
    linear-gradient(
    135deg,
    #00aa55,
    #55ff55
    );
}

#githubBtn{

    background:
    linear-gradient(
    135deg,
    #333,
    #666
    );
}

button:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 30px rgba(255,255,255,0.2);
}

/* ========================= */
/* TEXTO */
/* ========================= */

#bottomText{

    text-align:center;

    font-size:8px;

    opacity:0.7;

    line-height:1.8;
}

</style>

</head>

<body>

<div id="background"></div>

<div id="loginBox">

<div id="title">
UNDERWORLD LOGIN
</div>

<input
type="email"
id="email"
placeholder="EMAIL"
>

<input
type="password"
id="password"
placeholder="PASSWORD"
>

<button id="loginBtn">
LOGIN
</button>

<button id="googleBtn">
GOOGLE LOGIN
</button>

<button id="githubBtn">
GITHUB LOGIN
</button>

<div id="bottomText">
ENTER THE UNDERWORLD
</div>

</div>

<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>

<script>

/* ========================= */
/* LOGIN EMAIL */
/* ========================= */

document.getElementById("loginBtn")
.onclick = ()=>{

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    auth.signInWithEmailAndPassword(
        email,
        password
    )

    .then(()=>{

        alert("LOGIN SUCCESS");

        window.location.href =
        "menu.html";

    })

    .catch(error=>{

        alert(error.message);

    });

};

/* ========================= */
/* GOOGLE LOGIN */
/* ========================= */

document.getElementById("googleBtn")
.onclick = ()=>{

    const provider =
    new firebase.auth.GoogleAuthProvider();

    auth.signInWithPopup(provider)

    .then(()=>{

        alert("GOOGLE LOGIN SUCCESS");

        window.location.href =
        "menu.html";

    })

    .catch(error=>{

        alert(error.message);

    });

};

/* ========================= */
/* GITHUB LOGIN */
/* ========================= */

document.getElementById("githubBtn")
.onclick = ()=>{

    const provider =
    new firebase.auth.GithubAuthProvider();

    auth.signInWithPopup(provider)

    .then(()=>{

        alert("GITHUB LOGIN SUCCESS");

        window.location.href =
        "menu.html";

    })

    .catch(error=>{

        alert(error.message);

    });

};

</script>

</body>
</html>
