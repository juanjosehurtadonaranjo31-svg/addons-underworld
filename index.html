<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Addons Underworld</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Press Start 2P';
    background:linear-gradient(180deg,#000,#0a0a0a);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

.container{
    display:flex;
    flex-direction:column;
    gap:20px;
}

button{
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-family:'Press Start 2P';
    color:white;
}

.login{background:#7b2cbf;}
.enter{background:#00aa55;}

h1{
    color:#55ff55;
    text-shadow:0 0 20px #55ff55;
}

</style>

</head>

<body>

<div class="container">

<h1>ADDONS UNDERWORLD</h1>

<button class="login" onclick="location.href='login.html'">
INICIAR SESIÓN
</button>

<button class="enter" onclick="go()">
ENTRAR SIN CUENTA
</button>

</div>

<script>

function go(){

    const user = localStorage.getItem("user");

    if(!user){
        location.href = "login.html";
    } else {
        location.href = "menu.html";
    }

}

</script>

</body>
</html>
